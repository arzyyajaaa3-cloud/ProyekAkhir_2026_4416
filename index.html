<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pengolahan Kegiatan Kelas</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="kepala-halaman">
      <h1>Pengelolaan Kegiatan Kelas</h1>
      <p>Aplikasi untuk menambahkan, mencari, dan menghapus kegiatan kelas.</p>
    </header>

    <section class="panel" aria-label="Pengelolaan kegiatan">
      <h2>Kelola Kegiatan</h2>

      <div class="form-baris">
        <label for="inputKegiatan">Nama kegiatan</label>
        <input
          type="text"
          id="inputKegiatan"
          placeholder="Masukkan nama kegiatan"
        >
      </div>

      <div class="aksi">
        <button type="button" id="btnTambah">Tambah</button>
        <button type="button" id="btnCari">Cari</button>
        <button type="button" id="btnHapus">Hapus</button>
      </div>
    </section>

    <section class="panel" aria-label="Daftar kegiatan">
      <h2>Daftar Kegiatan</h2>

      <ol id="daftarKegiatan"></ol>

      <p class="ringkasan">
        Jumlah kegiatan:
        <strong id="totalKegiatan">0</strong>
      </p>

      <p id="pesanStatus" aria-live="polite">
        Status kegiatan akan muncul di sini.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
